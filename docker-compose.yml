# 멀티서비스 배포. 각 서비스가 독립 컨테이너 → 하나만 재배포해도 나머지는 안 멈춘다.
#   [로컬]  docker compose up -d --build            # 직접 빌드해서 전체 기동
#   [로컬]  docker compose up -d --build dashboard  # 대시보드만 재배포 (trader/collector 계속 돔) ✅
#   [프로덕션] .env에 IMAGE=ghcr.io/OWNER/REPO:TAG → docker compose pull && up -d --no-build
#              (EC2에서 컴파일 안 함 — 프리티어 1GB 안전. CI가 빌드해 ghcr에 올림)
# 설정은 .env (gitignore). 셋 다 ./data 볼륨 공유(캔들 캐시 + 봇 상태 state.json).
# 메모리 상한(mem_limit): EC2 t4g.small(2GB) 기준 — 한 컨테이너가 다 먹고 OOM 나는 것 방지.
#   합계 ~1.5G(2GB 내, OS/도커 여유 ~0.5G + 스왑 2GB 완충). limit 초과 시 그 컨테이너만 재시작.
#   ※ 1GB 인스턴스(t3.micro)로 내려가면 340/200/160 + 스왑 필수로 조정할 것.
services:

  trader:                                   # 실매매/페이퍼 봇 — 24/7, 안 멈춤
    build: .                                # 로컬 빌드용. 프로덕션은 IMAGE(ghcr) pull 사용
    image: ${IMAGE:-auto-trading}           # .env의 IMAGE로 레지스트리 이미지 지정 가능
    restart: unless-stopped
    mem_limit: 800m                         # 워밍업 때 캔들 로드로 피크 → 가장 여유 있게
    mem_reservation: 300m
    # TRADE_MODE 는 .env 에서: --paper(기본) / --live / "--live --real-money".
    # 따옴표 없이 넘겨야 두 인자로 쪼개진다.
    command: >
      sh -c "python -m engine.live \"$PRESET\" ${TRADE_MODE:---paper} --interval \"$INTERVAL\" --equity \"$EQUITY\""
    environment:
      PRESET: ${PRESET:-presets/examples/rsi-oversold-long.json}
      INTERVAL: ${INTERVAL:-60}
      EQUITY: ${EQUITY:-10000}
      # 알림: 봇 토큰+채널이 있으면 봇으로(버튼 준비), 없으면 웹훅으로 폴백.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}   # 기본 채널(카테고리별 채널 미설정 시 폴백)
      DISCORD_CHANNEL_TRADES: ${DISCORD_CHANNEL_TRADES:-}   # → #매매: 진입/청산/포지션/멈춤·재개/즉시청산
      DISCORD_CHANNEL_SYSTEM: ${DISCORD_CHANNEL_SYSTEM:-}   # → #모니터링: 기동/에러/네트워크/전략·설정
      NOTIFY_WEBHOOK: ${NOTIFY_WEBHOOK:-}
      CONTROL_PATH: /app/data/control.json  # 대시보드의 멈춤/재개 신호를 읽음
      LEDGER_PATH: /app/data/trades.db      # 매매 원장(대시보드가 읽음)
      # 진입 판정 로그 — 폴링마다 '왜 안 샀나'(조건 참/거짓·지표 현재값·차단 사유)를 한 줄씩.
      # 봇이 조용할 때 그게 조건 미충족인지 멈춤인지 쿨다운인지 밖에서 구별하려면 이게 필요하다.
      ENTRY_LOG_PATH: /app/data/entry_log.jsonl
      ENTRY_LOG_KEEP: ${ENTRY_LOG_KEEP:-3000}   # 보관 줄 수(폴링 1분이면 ≈이틀). 0 이면 기록 끔
      # 체결 실측 — 엔진이 기대한 체결 vs 거래소가 준 실제 체결(슬리피지·maker 비율·실수수료).
      # LiveExecutor 가 실제 체결로 포지션을 덮어쓰기 때문에, 여기 안 적으면 기대가가 사라진다.
      FILL_LOG_PATH: /app/data/fill_log.jsonl
      FILL_LOG_KEEP: ${FILL_LOG_KEEP:-5000}     # 체결은 폴링보다 훨씬 드물다 → 오래 남는다
      # 실거래 키 — .env(gitignore)에서 주입. 트레이더만 필요(collector·dashboard엔 X).
      # 출금권한 OFF·IP 화이트리스트 필수. 미설정이면 페이퍼(--paper)로만 동작.
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      # 네트워크 전용 키 — 대시보드에서 테스트넷↔실돈을 오가려면 둘 다 필요(계정이 다르다).
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY:-}
      BINANCE_TESTNET_API_SECRET: ${BINANCE_TESTNET_API_SECRET:-}
      BINANCE_MAINNET_API_KEY: ${BINANCE_MAINNET_API_KEY:-}
      BINANCE_MAINNET_API_SECRET: ${BINANCE_MAINNET_API_SECRET:-}
      BINANCE_TESTNET: ${BINANCE_TESTNET:-1}   # 시작 네트워크(이후엔 대시보드 스위치가 이긴다)
      MAKER_FILL_TIMEOUT_SEC: ${MAKER_FILL_TIMEOUT_SEC:-3}   # post-only 지정가 대기 초 → 넘으면 시장가
      LIVE_POSITION_PATH: /app/data/live_position.json       # 재시작 때 손절/익절가 복원용 사이드카
      PYTHONUNBUFFERED: 1                   # 도커 stdout은 파이프 → 블록버퍼링. 없으면 로그가 안 보임
      TZ: UTC
    volumes:
      - ./data:/app/data                    # 캔들 캐시 + state.json(대시보드가 읽음)
      - ./presets:/app/presets:ro
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  dashboard:                                # 대시보드만 (모니터 + 봇 멈춤/재개). 백테스트는 프로덕션에 안 올림.
    build: .                                # 이것만 재배포해도 trader/collector 안 멈춤. 가볍고 안전.
    image: ${IMAGE:-auto-trading}
    restart: unless-stopped
    mem_limit: 300m
    mem_reservation: 120m
    command: python -m engine.dashboard --port 8080
    environment:
      STATE_PATH: /app/data/state.json      # trader가 기록한 상태를 읽음
      CONTROL_PATH: /app/data/control.json  # 멈춤/재개 제어 파일
      LEDGER_PATH: /app/data/trades.db      # 매매 원장 읽기(이력·통계·거래별 차트)
      PYTHONUNBUFFERED: 1
      TZ: UTC
    ports:
      # ★ 보안: 대시보드는 인증이 없다(멈춤/재개·레버리지·가드레일을 그냥 POST). 그래서 기본은
      #   호스트 loopback 에만 바인드 → 인터넷에서 안 보이고 SSH 터널로만 접근한다.
      #     ssh -N -L 8080:localhost:8080 <EC2>  후  http://localhost:8080
      #   정말 공개로 열어야 하면 .env 에서 DASH_BIND=0.0.0.0 (+ 보안그룹으로 내 IP 만 허용).
      - "${DASH_BIND:-127.0.0.1}:${DASH_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data                    # state 읽기 + control 쓰기(멈춤/재개)
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    # 로컬에서 백테스트+대시보드 둘 다 보려면(프로덕션 아님):
    #   python3 -m engine.server            # http://localhost:8765  (/ 대시보드, /backtest 스튜디오, /collector 데이터)

  collector:                                # 캔들 수집 — 24/7 (trader도 자체 수집하나, 워치리스트 유지용)
    build: .
    image: ${IMAGE:-auto-trading}
    restart: unless-stopped
    mem_limit: 400m
    mem_reservation: 150m
    command: >
      sh -c "python -m engine.collector $COLLECT_SYMBOLS --loop \"$INTERVAL\" --start-running"
    environment:
      COLLECT_SYMBOLS: ${COLLECT_SYMBOLS:-BTCUSDC}
      INTERVAL: ${INTERVAL:-60}
      CONTROL_PATH: /app/data/control.json  # 대시보드의 멈춤/재개 신호를 읽음
      PYTHONUNBUFFERED: 1                   # ★ 수집기는 flush=True가 거의 없어 이게 없으면 로그가 통째로 안 보임
      TZ: UTC
    volumes:
      - ./data:/app/data
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  discordbot:                               # 디스코드 조회 봇 — read-only, 슬래시 명령(/status /position /stats)
    build: .                                # 대시보드처럼 state.json·trades.db 만 읽는 별개 프로세스(매매 무관)
    image: ${IMAGE:-auto-trading}
    restart: unless-stopped
    mem_limit: 200m
    mem_reservation: 80m
    command: python -m engine.discord_bot
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}          # 봇 토큰(없으면 기동 실패 — 켜려면 필수)
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}            # 이 서버에만 명령 등록 → 즉시 반영
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}   # 콤마구분 유저ID(비면 전원 거부)
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}        # 기본 채널(요약 채널 미설정 시 폴백)
      DISCORD_CHANNEL_DIGEST: ${DISCORD_CHANNEL_DIGEST:-}   # → #일일일지: 매일 요약(비면 기본 채널)
      DIGEST_HOUR: ${DIGEST_HOUR:-8}                     # 정기 요약 시각(시)
      DIGEST_TZ: ${DIGEST_TZ:-Asia/Seoul}                # 그 시각의 타임존(컨테이너 TZ=UTC 라 명시)
      STATE_PATH: /app/data/state.json      # trader 가 기록한 상태(대시보드와 동일)
      LEDGER_PATH: /app/data/trades.db      # 매매 원장(성과 집계)
      CONTROL_PATH: /app/data/control.json  # /control 버튼이 쓰는 멈춤/재개 신호(대시보드와 공용)
      CANDLE_DB_PATH: /app/data/candles.db  # /collect 가 읽는 캔들 캐시(collector 가 쓰는 것)
      COLLECT_STALE_MIN: ${COLLECT_STALE_MIN:-10}   # 마지막 봉이 이 분을 넘으면 /collect 에 ⚠️
      PYTHONUNBUFFERED: 1
      TZ: UTC
    volumes:
      - ./data:/app/data                    # 조회(state·원장) + /control 로 멈춤/재개 기록
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  watchdog:                                 # 데드맨 스위치 — 트레이더가 조용히 멈추면 알림(별개 프로세스)
    build: .                                # state.json 갱신이 끊기면 웹훅으로 경고. 트레이더가 죽어도 이건 산다.
    image: ${IMAGE:-auto-trading}
    restart: unless-stopped
    mem_limit: 80m                          # 표준 라이브러리 루프만 — 아주 가볍다
    mem_reservation: 32m
    command: python -m engine.watchdog
    environment:
      STATE_PATH: /app/data/state.json      # trader 가 남기는 상태 — 이 updatedAt 을 감시
      WATCHDOG_STALE_SEC: ${WATCHDOG_STALE_SEC:-600}       # 무갱신 몇 초면 '멈춤'(기본 10분)
      WATCHDOG_INTERVAL_SEC: ${WATCHDOG_INTERVAL_SEC:-120} # 확인 주기
      # 수집 감시 — collector 는 상태 파일을 안 남기므로 캐시의 마지막 봉으로 생사를 본다.
      CANDLE_DB_PATH: /app/data/candles.db                 # collector 가 쓰는 캔들 캐시
      COLLECT_STALE_MIN: ${COLLECT_STALE_MIN:-10}          # 마지막 봉이 이 분을 넘으면 '수집 멈춤'
      WATCH_COLLECTOR: ${WATCH_COLLECTOR:-1}               # 0 이면 수집 감시 끔
      CONTROL_PATH: /app/data/control.json                 # collector=paused 면 경고 안 함 + 트레이더 멈춤 감시
      # 멈춘 봇은 살아 있어서(state.json 계속 갱신) 위의 무갱신 감시엔 안 걸린다. 재배포로 되돌려진
      # 멈춤·즉시청산 자동정지·가드레일 래치가 전부 '조용한 무매매'로 남으므로 시간으로 잡는다.
      WATCHDOG_PAUSED_ALERT_SEC: ${WATCHDOG_PAUSED_ALERT_SEC:-21600}   # 6시간 멈춤이면 1회 경고(0=끔)
      # 알림 경로는 트레이더와 동일(engine.notifier): 봇 토큰 있으면 봇, 없으면 웹훅.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}          # 기본 채널(전용 채널 미설정 시 폴백)
      DISCORD_CHANNEL_SYSTEM: ${DISCORD_CHANNEL_SYSTEM:-}  # → #모니터링: 응답없음/복구 경고
      DISCORD_CHANNEL_TRADES: ${DISCORD_CHANNEL_TRADES:-}  # → #매매: '오래 멈춤' 경고(재개 버튼이 붙는다)
      NOTIFY_WEBHOOK: ${NOTIFY_WEBHOOK:-}
      PYTHONUNBUFFERED: 1
      TZ: UTC
    volumes:
      - ./data:/app/data                    # state.json 읽기 전용
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

# ⚠️ 실거래(LiveExecutor) 시 BINANCE_API_KEY/SECRET은 .env(gitignore)/시크릿으로. compose에 직접 X.
